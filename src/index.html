<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="output.css" />
  <title>Sign-up form</title>
</head>

<body class="h-dvh">
  <div class="flex flex-row h-full">
    <div class="flex justify-between flex-col bg-cover text-white w-5/12 text-center" style="background-image: url('../img/leaves.avif')">
      <div class="flex flex-row justify-center items-center grow self-stretch">
        <div class="flex flex-row justify-center items-center py-4 bg-neutral-950/50 grow">
          <img src="../img/odin-lined.png" alt="" class="h-32"> 
          <h1 class="text-8xl font-norse">ODIN</h1>
        </div>
      </div>
      <div class="grow content-end py-3">
        <p class="text-sm">Photo by <a class="underline" href="">Halie West</a> on <a class="underline" href="">Unsplash</a></p>
      </div>
    </div>

    <div class="flex flex-col justify-center w-7/12 bg-gray-100">
      <div class="grow flex justify-end flex-col gap-8 box-border px-9 pb-8 font-semibold">
        <p class="w-11/12 text-2xl">
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams.<br />
          Sign up <em>now</em> to get started.
        </p>
        <p class="text-2xl">You <em>know</em> you want to.</p>
      </div>

      <div class="bg-white flex flex-col shadow-md px-9 pb-9 pt-2 shadow-gray-300 justify-center">
        <form class="grow" id="odin_form">
          <fieldset class="flex flex-col gap-6 w-2/3">
            <legend class="my-4 font-bold text-2xl">Let's do this!</legend>
            <div class="flex justify-between">
              <div>
                <label for="first_name" class="block">
                <span class="uppercase text-gray-800 text-xs font-semibold tracking-widest">First Name</span>
                </label>
              <input class="border-indigo-100 border rounded-sm pl-2" type="text" id="first_name" name="first_name">
              </div>
              <div>
                <label for="last_name" class="block">
                <span class="uppercase text-gray-800 text-xs font-semibold tracking-widest">Last Name</span>
                </label>
              <input class="border-indigo-100 border rounded-sm pl-2" type="text" id="last_name" name="last_name">
              </div>
            </div>
            <div class="flex justify-between">
              <div>
                <label for="email" class="block">
                <span class="uppercase text-gray-800 text-xs font-semibold tracking-widest invalid:border-red-500 invalid:rounded-md">Email</span>
                </label>
              <input class="border-indigo-100 border rounded-sm pl-2" type="email" id="email" name="email">
              </div>
              <div>
                <label for="phone_number" class="block">
                <span class="uppercase text-gray-800 text-xs font-semibold tracking-widest  invalid:border-red-500 invalid:rounded-md">Phone Number</span>
                </label>
              <input class="border-indigo-100 border rounded-sm pl-2" type="tel" id="phone_number" name="phone_number">
              </div>
            </div>
            <div class="flex justify-between">
              <div>
                <label for="password" class="block">
                <span class="uppercase text-gray-800 text-xs font-semibold tracking-widest">Password</span>
                </label>
              <input class="border-indigo-100 border rounded-sm pl-2  invalid:border-red-500 invalid:rounded-md" type="password" id="password" name="password" minlength="8" title="Password must contain at least 8 characters">
              </div>
              <div>
                <label for="confirm_password" class="block">
                <span class="uppercase text-gray-800 text-xs font-semibold tracking-widest">Confirm Password</span>
                </label>
              <input class="border-indigo-100 border rounded-sm pl-2 invalid:border-red-500 invalid:rounded-md" type="password" id="confirm_password" name="confirm_password" minlength="8" title="Password must contain at least 8 characters">
              </div>
            </div>
          </fieldset>
        </form>
      </div>
      
      <div class="grow flex justify-start flex-col gap-8 px-9 pt-12 box-border">
        <div>
          <button class="bg-lime-800 text-white font-semibold text-lg px-14 py-3 rounded-lg" type="submit" form="odin_form">Create Account</button>
        </div>

        <div>
          <p class="text-xl">Already have an account? <a class="text-lime-800 font-bold" href="">Log in</a></p>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
